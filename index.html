<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walid's Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --grid: rgba(0, 255, 65, 0.05);
    --cyan: #39ff14;
    --cyan-dim: #0d4d10;
    --amber: #ffd700;
    --text: #e4ffdc;
    --dim: #2f8a2f;
    --panel-line: rgba(57, 255, 20, 0.22);
  }

  /* Once launched, every green accent switches to gold */
  body.launched{
    --cyan: #ffd700;
    --cyan-dim: #806000;
    --dim: #b8952f;
    --panel-line: rgba(255, 215, 0, 0.28);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  body{
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'VT323', monospace;
    position: relative;
  }

  /* Digital rain canvas sits behind everything */
  #matrixRain{
    position: absolute;
    inset: 0;
    display: block;
  }

  .frame{
    position: relative;
    z-index: 1;
    padding: 5.5vw 6.5vw;
    text-align: center;
    background: rgba(0, 8, 0, 0.45);
    backdrop-filter: blur(2px);
  }

  /* corner brackets, HUD-style */
  .frame::before, .frame::after,
  .corner-tr, .corner-bl{
    content: "";
    position: absolute;
    width: 28px;
    height: 28px;
    border: 2px solid var(--cyan-dim);
  }
  .frame::before{ top: 0; left: 0; border-right: none; border-bottom: none; }
  .frame::after{ bottom: 0; right: 0; border-left: none; border-top: none; }
  .corner-tr{ top: 0; right: 0; border-left: none; border-bottom: none; }
  .corner-bl{ bottom: 0; left: 0; border-right: none; border-top: none; }

  .eyebrow{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.8vw;
    color: var(--dim);
    font-size: 1.3vw;
    letter-spacing: 0.45vw;
    margin-bottom: 3vh;
    text-transform: uppercase;
  }
  .eyebrow .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.25; }
  }

  .clock{
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    color: var(--text);
    font-size: 8vw;
    line-height: 1;
    letter-spacing: 0.01em;
    text-shadow:
      0 0 4px #ffffff,
      0 0 12px rgba(180,255,170,0.9),
      0 0 28px rgba(57,255,20,0.75),
      0 0 60px rgba(57,255,20,0.5),
      0 0 110px rgba(57,255,20,0.3);
    font-variant-numeric: tabular-nums;
  }
  .clock .unit-sep{
    color: var(--cyan-dim);
    margin: 0 0.15vw;
  }
  .clock.launched{
    color: var(--amber);
    text-shadow:
      0 0 8px rgba(255,236,153,0.85),
      0 0 30px rgba(255,215,0,0.55),
      0 0 80px rgba(255,215,0,0.3);
  }

  .labels{
    display: flex;
    justify-content: center;
    gap: 3.4vw;
    color: var(--dim);
    font-size: 1.15vw;
    letter-spacing: 0.28vw;
    margin-top: 1.6vh;
    text-transform: uppercase;
  }

  .divider{
    width: 100%;
    max-width: 360px;
    height: 1px;
    margin: 3.2vh auto 2.6vh;
    background: linear-gradient(90deg, transparent, var(--panel-line), transparent);
  }

  .meta{
    display: flex;
    justify-content: space-between;
    gap: 3vw;
    color: var(--dim);
    font-size: 1.05vw;
    letter-spacing: 0.12vw;
  }
  .meta span{ color: var(--cyan); }

  .progress-track{
    margin-top: 2.4vh;
    width: 100%;
    max-width: 360px;
    height: 3px;
    background: rgba(94,234,212,0.1);
    margin-left: auto;
    margin-right: auto;
    position: relative;
    overflow: hidden;
  }
  .progress-fill{
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
    width: 0%;
    transition: width 1s linear;
  }

  @media (max-width: 640px){
    .clock{ font-size: 12vw; }
    .eyebrow{ font-size: 2.6vw; letter-spacing: 0.3vw; }
    .labels{ font-size: 2.2vw; gap: 4vw; }
    .meta{ font-size: 2.2vw; flex-direction: column; gap: 0.6vh; }
  }
</style>
</head>
<body>

<canvas id="matrixRain"></canvas>

<div class="frame">
  <div class="corner-tr"></div>
  <div class="corner-bl"></div>

  <div class="eyebrow"><span class="dot"></span>WALID'S COUNTER<span class="dot"></span></div>

  <div class="clock" id="clock">T-000:00:00:00</div>

  <div class="labels">
    <span>days</span><span>hrs</span><span>min</span><span>sec</span>
  </div>

  <div class="divider"></div>

  <div class="meta">
    <span id="targetDate">TARGET —</span>
    <span id="percentDone">0% ELAPSED</span>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
</div>

<script>
  // --- Digital rain background ---
  const rainCanvas = document.getElementById("matrixRain");
  const ctx = rainCanvas.getContext("2d");
  const glyphs = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789";
  let columns, drops, fontSize = 16;

  function sizeRain(){
    rainCanvas.width = window.innerWidth;
    rainCanvas.height = window.innerHeight;
    columns = Math.floor(rainCanvas.width / fontSize);
    drops = new Array(columns).fill(0).map(() => Math.floor(Math.random() * -40));
  }
  sizeRain();
  window.addEventListener("resize", sizeRain);

  let goldenColumn = -1;
  let launched = false; // becomes true once the target date/time is reached

  function drawRain(){
    ctx.fillStyle = "rgba(0, 0, 0, 0.06)";
    ctx.fillRect(0, 0, rainCanvas.width, rainCanvas.height);
    ctx.font = fontSize + "px 'Space Mono', monospace";

    for (let i = 0; i < columns; i++){
      const glyph = glyphs[Math.floor(Math.random() * glyphs.length)];
      const x = i * fontSize;
      const y = drops[i] * fontSize;

      const isGolden = launched || (i === goldenColumn);

      ctx.shadowColor = isGolden ? "#ffd700" : "#ffffff";
      ctx.shadowBlur = isGolden ? 8 : 6;
      ctx.fillStyle = isGolden ? "#ffd700" : "#ffffff"; // leading glyph
      ctx.fillText(glyph, x, y);
      ctx.shadowBlur = 0; // reset so trailing glyph stays sharp

      ctx.fillStyle = isGolden ? "rgba(255, 215, 0, 0.55)" : "rgba(57, 255, 20, 0.55)"; // trailing
      ctx.fillText(glyph, x, y - fontSize);

      if (y > rainCanvas.height && Math.random() > 0.975){
        drops[i] = 0;
      }
      drops[i]++;
    }
  }
  setInterval(drawRain, 45);

  // Every few seconds, one column's falling character turns golden (stops once launched)
  setInterval(() => {
    if (!launched) goldenColumn = Math.floor(Math.random() * columns);
  }, 4000);

  // Target launch date and time — edit this to change the countdown
  const targetDate = new Date("2026-08-10T10:00:00");
  const startDate  = new Date("2026-08-04T21:00:00"); // reference point for the progress bar

  const day = String(targetDate.getDate()).padStart(2, '0');
  const month = String(targetDate.getMonth() + 1).padStart(2, '0');
  const year = targetDate.getFullYear();
  document.getElementById("targetDate").innerText = `TARGET ${day}/${month}/${year}`;

  const clockEl = document.getElementById("clock");
  const fillEl = document.getElementById("progressFill");
  const percentEl = document.getElementById("percentDone");

  function updateCountdown(){
    const now = new Date();
    let diff = targetDate - now;

    const sign = diff <= 0 ? "+" : "-";

    if (diff <= 0){
      launched = true;
      clockEl.classList.add("launched");
      document.body.classList.add("launched");
      fillEl.style.width = "100%";
      percentEl.innerText = "LAUNCHED";
      diff = now - targetDate; // count up since target
    } else {
      const total = targetDate - startDate;
      const elapsed = now - startDate;
      const pct = Math.min(100, Math.max(0, (elapsed / total) * 100));
      fillEl.style.width = pct.toFixed(2) + "%";
      percentEl.innerText = pct.toFixed(1) + "% ELAPSED";
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    diff %= (1000 * 60 * 60 * 24);
    const hours = Math.floor(diff / (1000 * 60 * 60));
    diff %= (1000 * 60 * 60);
    const minutes = Math.floor(diff / (1000 * 60));
    diff %= (1000 * 60);
    const seconds = Math.floor(diff / 1000);

    clockEl.innerHTML =
      `T${sign}${String(days).padStart(3, '0')}<span class="unit-sep">:</span>` +
      `${String(hours).padStart(2, '0')}<span class="unit-sep">:</span>` +
      `${String(minutes).padStart(2, '0')}<span class="unit-sep">:</span>` +
      `${String(seconds).padStart(2, '0')}`;
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
