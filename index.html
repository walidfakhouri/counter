<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walid's Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f4f5f7;
    --ink: #0e0e10;
    --muted: #55565c;
    --soft: #9a9ba1;
    --empty: #d9dadf;
    --accent: #d12a20;
  }
  /* Gold once launched */
  body.launched{ --accent: #b8860b; }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    min-height: 100%;
    background: var(--bg);
  }

  body{
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: 'Manrope', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    padding: 32px 16px;
  }

  .wrap{
    width: min(1180px, 100%);
    display: flex;
    gap: clamp(32px, 6vw, 72px);
    align-items: center;
  }

  /* ---------- Left: numbers ---------- */
  .info{
    flex: 0 0 clamp(300px, 34vw, 420px);
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .eyebrow{
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .days{
    font-weight: 300;
    font-size: clamp(96px, 13vw, 168px);
    line-height: 0.9;
    letter-spacing: -0.05em;
    font-variant-numeric: tabular-nums;
  }
  .days-label{
    margin-top: 6px;
    font-size: 18px;
    font-weight: 500;
    color: var(--muted);
  }

  .hms{
    font-weight: 500;
    font-size: clamp(28px, 3vw, 36px);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  .hms .sep{ color: var(--soft); }
  .hms .sec{ color: var(--accent); transition: color 1s ease; }

  .meta{
    display: flex;
    gap: 32px;
    padding-top: 20px;
    border-top: 2px solid var(--ink);
  }
  .meta div{ display: flex; flex-direction: column; gap: 6px; }
  .meta .k{
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .meta .v{ font-size: 16px; font-weight: 700; }
  .meta .v.accent{ color: var(--accent); }

  /* ---------- Right: day grid ---------- */
  .board{
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(30, minmax(0, 1fr));
    gap: 6px;
  }

  .dot{
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--empty);
    transition: background 0.6s ease;
  }
  .dot.done{ background: var(--ink); }
  .dot.today{
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent);
    animation: beat 2.4s ease-in-out infinite;
  }
  @keyframes beat{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(0.82); }
  }

  .legend{
    display: flex;
    gap: 24px;
    font-size: 13px;
    color: var(--muted);
  }
  .legend span{ display: flex; align-items: center; gap: 8px; }
  .legend i{ width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  @media (max-width: 820px){
    .wrap{ flex-direction: column; align-items: stretch; }
    .info{ flex: none; }
    .grid{ grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 5px; }
  }

  @media (prefers-reduced-motion: reduce){
    .dot.today{ animation: none; }
  }
</style>
</head>
<body>

<main class="wrap">
  <section class="info">
    <div class="eyebrow">Walid's Counter</div>

    <div>
      <div class="days" id="d">000</div>
      <div class="days-label" id="daysLabel">days to go</div>
    </div>

    <div class="hms">
      <span id="h">00</span><span class="sep">:</span><span id="m">00</span><span class="sep">:</span><span class="sec" id="s">00</span>
    </div>

    <div class="meta">
      <div><span class="k">Target</span><span class="v" id="targetDate">—</span></div>
      <div><span class="k" id="elapsedKey">Elapsed</span><span class="v accent" id="elapsed">—</span></div>
    </div>
  </section>

  <section class="board">
    <div class="grid" id="grid" role="img" aria-label="Days elapsed"></div>
    <div class="legend">
      <span><i style="background: var(--ink)"></i>Done</span>
      <span><i style="background: var(--accent)"></i>Today</span>
      <span><i style="background: var(--empty)"></i>To go</span>
    </div>
  </section>
</main>

<script>
  // Target launch date and time — edit this to change the countdown
  const targetDate = new Date("2027-10-23T13:59:00");
  const startDate  = new Date("2026-10-23T13:59:00"); // first dot of the grid

  const DAY = 86400000, HOUR = 3600000, MIN = 60000;
  const pad = (n, l = 2) => String(n).padStart(l, "0");
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  document.getElementById("targetDate").textContent =
    `${targetDate.getDate()} ${months[targetDate.getMonth()]} ${targetDate.getFullYear()}`;

  // Build one dot per day between start and target
  const totalDays = Math.ceil((targetDate - startDate) / DAY);
  const grid = document.getElementById("grid");
  const dots = [];
  for (let i = 0; i < totalDays; i++){
    const dot = document.createElement("div");
    dot.className = "dot";
    grid.appendChild(dot);
    dots.push(dot);
  }

  const els = {
    d: document.getElementById("d"),
    h: document.getElementById("h"),
    m: document.getElementById("m"),
    s: document.getElementById("s"),
    daysLabel: document.getElementById("daysLabel"),
    elapsed: document.getElementById("elapsed"),
    elapsedKey: document.getElementById("elapsedKey"),
  };

  let lastDone = -1;

  function paintGrid(done, launched){
    if (done === lastDone) return; // only repaint when the day changes
    lastDone = done;
    dots.forEach((dot, i) => {
      dot.className = "dot" +
        (launched || i < done ? " done" : "") +
        (!launched && i === done ? " today" : "");
    });
    grid.setAttribute("aria-label", `${Math.min(done, totalDays)} of ${totalDays} days elapsed`);
  }

  function update(){
    const now = new Date();
    let diff = targetDate - now;
    const launched = diff <= 0;

    if (launched){
      document.body.classList.add("launched");
      els.daysLabel.textContent = "days since launch";
      els.elapsedKey.textContent = "Status";
      els.elapsed.textContent = "Launched";
      paintGrid(totalDays, true);
      diff = now - targetDate; // count up since target
    } else {
      const done = Math.max(0, Math.min(totalDays, Math.floor((now - startDate) / DAY)));
      els.elapsed.textContent = `${done + 1} of ${totalDays} days`;
      paintGrid(done, false);
    }

    els.d.textContent = pad(Math.floor(diff / DAY), 3);
    els.h.textContent = pad(Math.floor((diff % DAY) / HOUR));
    els.m.textContent = pad(Math.floor((diff % HOUR) / MIN));
    els.s.textContent = pad(Math.floor((diff % MIN) / 1000));
  }

  update();
  setInterval(update, 1000);
</script>

</body>
</html>
