<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walid's Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f4f5f7;
    --ink: #0e0e10;
    --muted: #55565c;
    --soft: #9a9ba1;
    --empty: #d9dadf;
    --accent: #d12a20;
  }
  /* Gold once launched */
  body.launched{ --accent: #b8860b; }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    min-height: 100%;
    background: var(--bg);
  }

  body{
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: 'Manrope', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    padding: 32px 16px;
  }

  .wrap{
    width: min(1180px, 100%);
    display: flex;
    gap: clamp(32px, 6vw, 72px);
    align-items: center;
  }

  /* ---------- Left: numbers ---------- */
  .info{
    flex: 0 0 clamp(300px, 34vw, 420px);
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .eyebrow{
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .days{
    font-weight: 300;
    font-size: clamp(96px, 13vw, 168px);
    line-height: 0.9;
    letter-spacing: -0.05em;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    transition: color 1s ease;
  }
  .days-label{
    margin-top: 6px;
    font-size: 18px;
    font-weight: 500;
    color: var(--muted);
  }

  .hms{
    font-weight: 500;
    font-size: clamp(28px, 3vw, 36px);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  .hms .sep{ color: var(--soft); }

  .meta{
    display: flex;
    gap: 32px;
    padding-top: 20px;
    border-top: 2px solid var(--ink);
  }
  .meta div{ display: flex; flex-direction: column; gap: 6px; }
  .meta .k{
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .meta .v{ font-size: 16px; font-weight: 700; }
  .meta .v.accent{ color: var(--accent); }

  /* ---------- Right: month grid ---------- */
  .board{
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .grid{
    display: grid;
    grid-template-columns: 52px repeat(31, minmax(0, 1fr));
    gap: 5px;
    align-items: center;
  }

  .month{
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
  }
  .month b{ font-weight: 700; color: var(--ink); }

  .dot{
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--empty);
    transition: background 0.6s ease;
  }
  .dot.out{
    background: transparent;
    box-shadow: inset 0 0 0 1px var(--empty);
  }
  .dot.done{ background: var(--ink); }
  .dot.today{
    background: var(--accent);
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    animation: beat 2.4s ease-in-out infinite;
  }
  @keyframes beat{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(0.82); }
  }

  .legend{
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    font-size: 13px;
    color: var(--muted);
    padding-left: 57px;
  }
  .legend span{ display: flex; align-items: center; gap: 8px; }
  .legend i{ width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  @media (max-width: 820px){
    .wrap{ flex-direction: column; align-items: stretch; }
    .info{ flex: none; }
    .grid{ grid-template-columns: 40px repeat(31, minmax(0, 1fr)); gap: 3px; }
    .month{ font-size: 10px; }
    .legend{ padding-left: 0; }
  }

  @media (prefers-reduced-motion: reduce){
    .dot.today{ animation: none; }
  }
</style>
</head>
<body>

<main class="wrap">
  <section class="info">
    <div class="eyebrow">Walid's Counter</div>

    <div>
      <div class="days" id="d">000</div>
      <div class="days-label" id="daysLabel">days to go</div>
    </div>

    <div class="hms">
      <span id="h">00</span><span class="sep">:</span><span id="m">00</span><span class="sep">:</span><span id="s">00</span>
    </div>

    <div class="meta">
      <div><span class="k">Target</span><span class="v" id="targetDate">—</span></div>
      <div><span class="k" id="elapsedKey">Day</span><span class="v accent" id="elapsed">—</span></div>
    </div>
  </section>

  <section class="board">
    <div class="grid" id="grid" role="img" aria-label="Days elapsed"></div>
    <div class="legend">
      <span><i style="background: var(--ink)"></i>Done</span>
      <span><i style="background: var(--accent)"></i>Today</span>
      <span><i style="background: var(--empty)"></i>To go</span>
      <span><i style="box-shadow: inset 0 0 0 1px var(--empty)"></i>Outside range</span>
    </div>
  </section>
</main>

<script>
  // Start and target — edit these to change the countdown
  const startDate  = new Date("2026-10-23T00:00:00");
  const targetDate = new Date("2027-10-23T16:00:00");

  const DAY = 86400000, HOUR = 3600000, MIN = 60000;
  const pad = (n, l = 2) => String(n).padStart(l, "0");
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const key = (y, m, d) => y * 10000 + m * 100 + d;          // sortable calendar-day key
  const dateKey = (dt) => key(dt.getFullYear(), dt.getMonth(), dt.getDate());

  document.getElementById("targetDate").textContent =
    `${targetDate.getDate()} ${months[targetDate.getMonth()]} ${targetDate.getFullYear()}`;

  const startKey = dateKey(startDate);
  const endKey = dateKey(targetDate);

  // Build one row per month, one dot per calendar day
  const grid = document.getElementById("grid");
  const dots = []; // { key, el, inRange }
  let y = startDate.getFullYear(), mo = startDate.getMonth();
  let firstRow = true;

  while (key(y, mo, 1) <= endKey){
    const label = document.createElement("div");
    label.className = "month";
    label.innerHTML = (firstRow || mo === 0)
      ? `<b>${months[mo]}</b> ${String(y).slice(2)}`
      : `<b>${months[mo]}</b>`;
    grid.appendChild(label);

    const daysInMonth = new Date(y, mo + 1, 0).getDate();
    for (let d = 1; d <= 31; d++){
      const cell = document.createElement("div");
      if (d <= daysInMonth){
        const k = key(y, mo, d);
        const inRange = k >= startKey && k <= endKey;
        cell.className = "dot" + (inRange ? "" : " out");
        cell.title = `${d} ${months[mo]} ${y}`;
        if (inRange) dots.push({ key: k, el: cell });
      }
      grid.appendChild(cell); // empty cell keeps short months aligned
    }

    firstRow = false;
    mo++;
    if (mo > 11){ mo = 0; y++; }
  }

  const totalDays = dots.length;

  const els = {
    d: document.getElementById("d"),
    h: document.getElementById("h"),
    m: document.getElementById("m"),
    s: document.getElementById("s"),
    daysLabel: document.getElementById("daysLabel"),
    elapsed: document.getElementById("elapsed"),
    elapsedKey: document.getElementById("elapsedKey"),
  };

  let lastKey = -1;

  function paintGrid(todayKey, launched){
    if (todayKey === lastKey) return; // only repaint when the date changes
    lastKey = todayKey;
    let done = 0;
    dots.forEach(({ key: k, el }) => {
      const isDone = launched || k < todayKey;
      const isToday = !launched && k === todayKey;
      if (isDone) done++;
      el.className = "dot" + (isDone ? " done" : "") + (isToday ? " today" : "");
    });
    grid.setAttribute("aria-label", `${done} of ${totalDays} days elapsed`);
    return done;
  }

  function update(){
    const now = new Date();
    let diff = targetDate - now;
    const launched = diff <= 0;
    const todayKey = dateKey(now);

    if (launched){
      document.body.classList.add("launched");
      els.daysLabel.textContent = "days since launch";
      els.elapsedKey.textContent = "Status";
      els.elapsed.textContent = "Launched";
      paintGrid(-2, true);
      diff = now - targetDate; // count up since target
    } else {
      paintGrid(todayKey, false);
      const dayNum = dots.findIndex(d => d.key === todayKey) + 1;
      els.elapsed.textContent = dayNum > 0 ? `${dayNum} of ${totalDays}` : `0 of ${totalDays}`;
    }

    els.d.textContent = pad(Math.floor(diff / DAY), 3);
    els.h.textContent = pad(Math.floor((diff % DAY) / HOUR));
    els.m.textContent = pad(Math.floor((diff % HOUR) / MIN));
    els.s.textContent = pad(Math.floor((diff % MIN) / 1000));
  }

  update();
  setInterval(update, 1000);
</script>

</body>
</html>
