<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walid's Counter</title>
<style>
  :root{
    --ink: #f5f5f7;
    --sub: rgba(245,245,247,0.56);
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.14);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body{
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    position: relative;
  }

  /* soft aurora glow, Apple-keynote style */
  .aurora{
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .aurora span{
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(1){
    width: 42vw; height: 42vw;
    background: #5e6bff;
    top: -10%; left: -8%;
    animation-delay: 0s;
  }
  .aurora span:nth-child(2){
    width: 38vw; height: 38vw;
    background: #ff5ea8;
    bottom: -12%; right: -6%;
    animation-delay: 4s;
  }
  .aurora span:nth-child(3){
    width: 30vw; height: 30vw;
    background: #46e0c4;
    bottom: 6%; left: 12%;
    animation-delay: 8s;
    opacity: 0.35;
  }
  @keyframes drift{
    0%{ transform: translate(0,0) scale(1); }
    100%{ transform: translate(4%, -4%) scale(1.08); }
  }

  .container{
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 4vw;
  }

  .eyebrow{
    color: var(--sub);
    font-size: 1vw;
    font-weight: 590;
    letter-spacing: 0.02em;
    margin-bottom: 2.2vh;
    text-transform: uppercase;
  }

  .title{
    color: var(--ink);
    font-size: 2.6vw;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 5vh;
    background: linear-gradient(90deg, #fff, #c9c9d6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .units{
    display: flex;
    gap: 1.4vw;
    justify-content: center;
  }

  .unit{
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-radius: 1.4vw;
    padding: 2.4vw 1.8vw;
    min-width: 8vw;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.08) inset,
      0 20px 40px rgba(0,0,0,0.35);
  }

  .unit .value{
    font-size: 4.2vw;
    font-weight: 650;
    color: var(--ink);
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .unit .label{
    margin-top: 1vh;
    font-size: 0.85vw;
    color: var(--sub);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 590;
  }

  .footer{
    margin-top: 4vh;
    color: var(--sub);
    font-size: 0.85vw;
    font-weight: 510;
    letter-spacing: 0.01em;
  }

  .container.launched .value{
    background: linear-gradient(90deg, #5e6bff, #ff5ea8);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  @media (max-width: 640px){
    .title{ font-size: 5.2vw; }
    .eyebrow{ font-size: 3vw; }
    .units{ flex-wrap: wrap; gap: 3vw; }
    .unit{ min-width: 20vw; padding: 5vw 3vw; border-radius: 5vw; }
    .unit .value{ font-size: 9vw; }
    .unit .label{ font-size: 2.4vw; }
    .footer{ font-size: 2.6vw; }
  }
</style>
</head>
<body>

<div class="aurora"><span></span><span></span><span></span></div>

<div class="container" id="container">
  <div class="eyebrow">Walid's Counter</div>
  <div class="title">Something new is coming.</div>

  <div class="units">
    <div class="unit"><div class="value" id="days">000</div><div class="label">Days</div></div>
    <div class="unit"><div class="value" id="hours">00</div><div class="label">Hours</div></div>
    <div class="unit"><div class="value" id="minutes">00</div><div class="label">Minutes</div></div>
    <div class="unit"><div class="value" id="seconds">00</div><div class="label">Seconds</div></div>
  </div>

  <div class="footer" id="targetDate">Target —</div>
</div>

<script>
  // Target launch date and time — edit this to change the countdown
  const targetDate = new Date("2026-08-03T10:00:00");

  const day = String(targetDate.getDate()).padStart(2, '0');
  const month = String(targetDate.getMonth() + 1).padStart(2, '0');
  const year = targetDate.getFullYear();
  document.getElementById("targetDate").innerText = `Target date: ${day}/${month}/${year}`;

  const container = document.getElementById("container");
  const daysEl = document.getElementById("days");
  const hoursEl = document.getElementById("hours");
  const minutesEl = document.getElementById("minutes");
  const secondsEl = document.getElementById("seconds");

  function updateCountdown(){
    const now = new Date();
    let diff = targetDate - now;

    if (diff <= 0){
      container.classList.add("launched");
      daysEl.innerText = "000";
      hoursEl.innerText = "00";
      minutesEl.innerText = "00";
      secondsEl.innerText = "00";
      document.querySelector(".title").innerText = "It's here.";
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    diff %= (1000 * 60 * 60 * 24);
    const hours = Math.floor(diff / (1000 * 60 * 60));
    diff %= (1000 * 60 * 60);
    const minutes = Math.floor(diff / (1000 * 60));
    diff %= (1000 * 60);
    const seconds = Math.floor(diff / 1000);

    daysEl.innerText = String(days).padStart(3, '0');
    hoursEl.innerText = String(hours).padStart(2, '0');
    minutesEl.innerText = String(minutes).padStart(2, '0');
    secondsEl.innerText = String(seconds).padStart(2, '0');
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
