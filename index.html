<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Walid's Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #09090b;
    --red: #ff4136;
    --ink: #ececef;
    --muted: #8a8b93;
    --line: #26272c;
    --todo: #1b1c21;
    --out: #24252a;
  }

  *{ box-sizing: border-box; }
  html, body{ margin: 0; min-height: 100%; background: var(--bg); }
  body{
    min-height: 100vh;
    color: var(--ink);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(circle at 24% 46%, #2a0c0a 0%, #110807 35%, rgba(9,9,11,0) 65%) fixed,
      var(--bg);
    overflow-x: hidden;
  }

  /* ---------- Layout (S1 · Refined) ---------- */
  .screen{
    width: min(1280px, 100%);
    min-height: 100vh;
    margin: 0 auto;
    padding: 56px 72px;
    display: grid;
    grid-template-columns: minmax(0, 600px) minmax(0, 1fr);
    gap: 60px;
    align-items: center;
  }
  .counter{ display: flex; flex-direction: column; gap: 22px; }
  .eyebrow{
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .eyebrow #statusFlag{ color: var(--red); font-size: 12px; letter-spacing: 0.2em; align-self: center; }

  .days{
    font-weight: 800;
    font-size: clamp(150px, 20vw, 280px);
    line-height: 0.78;
    letter-spacing: -0.07em;
    margin-left: -0.04em;
    color: var(--red);
    font-variant-numeric: tabular-nums;
    user-select: none;
  }
  .caption{ font-size: 20px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }

  .breakdown{
    padding-top: 18px;
    border-top: 4px solid var(--ink);
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 18px;
  }
  .unit{ display: flex; flex-direction: column; gap: 6px; user-select: none; }
  .unit .n{
    font-size: clamp(30px, 3.2vw, 40px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .unit.sec .n{ color: var(--red); }
  .unit .l{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .unit.flash .n, .days.flash{ animation: flash 0.9s ease-out; }
  @keyframes flash{ 0%{ color: #ffffff; } }

  .status{ display: flex; flex-wrap: wrap; gap: 14px 34px; }
  .stat{ display: flex; flex-direction: column; gap: 6px; }
  .stat .k{ font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .stat .v{ font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat .v.red{ color: var(--red); }

  /* ---------- Year grid ---------- */
  .timeline{ display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .timeline .head{
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .grid{
    display: grid;
    grid-template-columns: 44px repeat(31, minmax(0, 1fr));
    gap: 4px;
    align-items: center;
  }
  .month{ font-size: 11px; font-weight: 700; white-space: nowrap; }
  .month span{ font-weight: 500; color: var(--muted); }
  .cell{ aspect-ratio: 1; }
  .sq{ width: 100%; height: 100%; border-radius: 50%; transition: background .6s; }
  .sq.out{ box-shadow: inset 0 0 0 1px var(--out); }
  .sq.todo{ background: var(--todo); }
  .sq.done{ background: var(--ink); }
  .sq.today{ background: var(--red); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--red); }

  /* ---------- Sound button ---------- */
  .sound{
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 21;                                    /* stays usable above the final-minute overlay */
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid var(--line);
    background: rgba(9,9,11,0.85);
    color: var(--muted);
    cursor: pointer;
    transition: color .3s, border-color .3s;
  }
  .sound:hover{ color: var(--ink); border-color: var(--muted); }
  .sound:focus-visible{ outline: 2px solid var(--red); outline-offset: 2px; }
  .sound svg{ width: 22px; height: 22px; display: none; }
  .sound[data-mode="all"] .i-all,
  .sound[data-mode="quiet"] .i-quiet,
  .sound[data-mode="off"] .i-off{ display: block; }
  .sound[data-mode="all"]{ color: var(--red); border-color: var(--red); }
  .sound[data-mode="quiet"]{ color: var(--red); }

  /* ---------- "Today is the day" banner over the counters ---------- */
  .today-banner{
    position: fixed;
    inset: 0;
    z-index: 15;
    display: none;
    place-items: center;
    padding: 16px;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(9,9,11,0.85) 0%, rgba(9,9,11,0.55) 55%, rgba(9,9,11,0.15) 100%);
  }
  body.arrived .today-banner{ display: grid; animation: msgIn 1.4s ease-out both; }
  .today-banner span{
    font-size: clamp(54px, 10vw, 168px);
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    text-align: center;
    color: var(--ink);
  }
  @keyframes msgIn{ from{ opacity: 0; transform: scale(1.06); } to{ opacity: 1; transform: none; } }

  /* ---------- Final-minute overlay ---------- */
  .final{
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    background: rgba(9,9,11,0.96);
    opacity: 0;
    pointer-events: none;
    transition: opacity .9s ease;
  }
  .final.show{ opacity: 1; pointer-events: auto; }
  .final::before{                                   /* red pulse that grows in the last seconds */
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(255,65,54,0) 30%, rgba(255,65,54,0.25) 100%);
    opacity: 0;
    transition: opacity .6s;
  }
  .final[data-phase="tense"]::before{ opacity: .35; }
  .final[data-phase="critical"]::before{ opacity: 1; animation: alarm 1s ease-in-out infinite; }
  .final[data-phase="zero"]::before{ opacity: 0; }
  @keyframes alarm{ 0%,100%{ opacity: .45; } 50%{ opacity: 1; } }
  .final-inner{ position: relative; display: flex; flex-direction: column; align-items: center; gap: 3vh; text-align: center; padding: 16px; }
  .final-label{
    font-size: clamp(14px, 1.8vw, 20px);
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .final[data-phase="critical"] .final-label{ color: var(--red); }
  .final-digits{
    font-size: min(46vw, 58vh);
    font-weight: 800;
    line-height: 0.8;
    letter-spacing: -0.07em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .final[data-phase="tense"] .final-digits, .final[data-phase="critical"] .final-digits{ color: var(--red); }
  .final-digits.beat{ animation: beat .5s ease-out; }
  @keyframes beat{ 0%{ transform: scale(1.05); } 100%{ transform: scale(1); } }
  .final-bar{ width: min(70vw, 720px); height: 4px; background: rgba(255,255,255,0.1); }
  .final-bar i{ display: block; height: 100%; width: 100%; background: var(--red); transition: width .25s linear; }
  .final-reached{
    display: none;
    font-size: clamp(40px, 8vw, 120px);
    font-weight: 800;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .final[data-phase="zero"] .final-reached{ display: block; animation: reached 1.4s ease-out both; }
  .final[data-phase="zero"] .final-digits, .final[data-phase="zero"] .final-bar{ display: none; }
  @keyframes reached{ 0%{ opacity: 0; transform: scale(1.3); filter: blur(8px); } 100%{ opacity: 1; transform: none; filter: none; } }
  .final-flash{ position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .final[data-phase="zero"] .final-flash{ animation: whiteout 1.6s ease-out; }
  @keyframes whiteout{ 0%{ opacity: .9; } 100%{ opacity: 0; } }
  .final-controls{ display: none; gap: 10px; margin-top: 2vh; flex-wrap: wrap; justify-content: center; }
  body.previewing .final-controls{ display: flex; }
  .final-controls button, .preview-note button{
    min-height: 44px; padding: 0 18px;
    background: transparent; border: 1px solid var(--line); color: var(--ink);
    font: 700 13px/1 'Manrope', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;
  }
  .preview-note{
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 16;
    display: none; align-items: center; gap: 14px; padding: 8px 8px 8px 16px;
    background: rgba(9,9,11,0.92); border: 1px solid var(--red);
    font: 700 12px/1.2 'Manrope', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red);
  }
  body.previewing.arrived .preview-note{ display: flex; }

  /* ---------- Phones and narrow windows ---------- */
  @media (max-width: 960px){
    .screen{ grid-template-columns: minmax(0, 1fr); padding: 76px 16px 32px; gap: 40px; align-items: start; }
    .days{ font-size: 38vw; }
    .breakdown{ grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 20px; }
    .unit .n{ font-size: 36px; }
    .grid{ grid-template-columns: 36px repeat(31, minmax(0, 1fr)); gap: 2px; }
    .month{ font-size: 9px; }
  }
  @media (prefers-reduced-motion: reduce){
    .final::before, .final-digits.beat, .final-reached, .final-flash, .today-banner{ animation: none !important; }
  }
</style>
</head>
<body>

<!-- Final-minute overlay -->
<div class="final" id="finalOverlay" data-phase="calm" role="dialog" aria-modal="false" aria-label="Final minute countdown" aria-hidden="true">
  <div class="final-flash"></div>
  <div class="final-inner">
    <div class="final-label" id="finalLabel">Final minute</div>
    <div class="final-digits" id="finalDigits" aria-label="Seconds remaining">60</div>
    <div class="final-reached">Today is the day</div>
    <div class="final-bar"><i id="finalBar"></i></div>
    <div class="final-controls">
      <button type="button" id="skipBtn">Skip to last 10 s</button>
      <button type="button" id="exitBtn">Exit preview</button>
    </div>
  </div>
</div>

<div class="today-banner" id="todayBanner" role="status"><span>Today is<br>the day</span></div>

<div class="preview-note" id="previewNote">Preview · returning to the live countdown <button type="button" id="exitBtn2">Exit now</button></div>

<button class="sound" id="soundBtn" type="button" data-mode="all">
  <!-- all sound on -->
  <svg class="i-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <!-- seconds tick muted -->
  <svg class="i-quiet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
  <!-- everything muted -->
  <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
</button>

<main class="screen">

  <section class="counter">
    <div class="eyebrow"><span>Walid's Counter</span><span id="statusFlag">Countdown active</span></div>
    <div class="days" id="daysDisplay" aria-label="Days remaining">000</div>
    <div class="caption" id="daysLabel">Days to go</div>

    <div class="breakdown" aria-label="Time remaining">
      <div class="unit" id="uMo"><span class="n" id="dMo">00</span><span class="l">Months</span></div>
      <div class="unit" id="uWk"><span class="n" id="dWk">00</span><span class="l">Weeks</span></div>
      <div class="unit" id="uDy"><span class="n" id="dDy">00</span><span class="l">Days</span></div>
      <div class="unit" id="uHr"><span class="n" id="dHr">00</span><span class="l">Hours</span></div>
      <div class="unit" id="uMi"><span class="n" id="dMi">00</span><span class="l">Min</span></div>
      <div class="unit sec" id="uSe"><span class="n" id="dSe">00</span><span class="l">Sec</span></div>
    </div>

    <div class="status">
      <div class="stat"><span class="k">Target</span><span class="v" id="targetDate">—</span></div>
      <div class="stat"><span class="k">Progress</span><span class="v red" id="progress">—</span></div>
      <div class="stat"><span class="k">Local time</span><span class="v" id="localClock">—</span></div>
    </div>
  </section>

  <section class="timeline">
    <div class="head"><span>Timeline</span><span id="dayCount">Day 000 / 365</span></div>
    <div class="grid" id="grid" role="img" aria-label="Days elapsed"></div>
  </section>

</main>

<script>
  // Start and target — edit these to change the countdown
  const startDate  = new Date("2026-10-23T00:00:00");
  const targetDate = new Date("2027-10-23T00:00:00");

  const SEC = 1000, MIN = 60 * SEC, HOUR = 60 * MIN, DAY = 24 * HOUR, WEEK = 7 * DAY;
  const pad = (n, l = 2) => String(n).padStart(l, "0");
  const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const key = (y, m, d) => y * 10000 + m * 100 + d;
  const dateKey = (dt) => key(dt.getFullYear(), dt.getMonth(), dt.getDate());

  /* ---------------- Seven-segment displays ---------------- */
  const NS = "http://www.w3.org/2000/svg";
  // Thick segments (12 units) with small gaps for legibility
  const H = (yc) => `14,${yc - 6} 46,${yc - 6} 52,${yc} 46,${yc + 6} 14,${yc + 6} 8,${yc}`;
  const V = (xc, y1, y2) => `${xc},${y1} ${xc + 6},${y1 + 6} ${xc + 6},${y2 - 6} ${xc},${y2} ${xc - 6},${y2 - 6} ${xc - 6},${y1 + 6}`;
  const SEGS = { a: H(7), g: H(50), d: H(93), f: V(7, 10, 48), b: V(53, 10, 48), e: V(7, 52, 90), c: V(53, 52, 90) };
  const MAP = { "0":"abcdef", "1":"bc", "2":"abged", "3":"abgcd", "4":"fgbc", "5":"afgcd",
                "6":"afgedc", "7":"abc", "8":"abcdefg", "9":"abcfgd", " ":"" };

  function makeDigit(){
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 60 100");
    svg.setAttribute("overflow", "visible");
    svg.setAttribute("aria-hidden", "true");
    svg.classList.add("digit");
    const segs = {};
    for (const [id, pts] of Object.entries(SEGS)){
      const p = document.createElementNS(NS, "polygon");
      p.setAttribute("points", pts);
      p.classList.add("seg");
      svg.appendChild(p);
      segs[id] = p;
    }
    return {
      el: svg,
      set(ch){
        const on = MAP[ch] ?? "";
        for (const k in segs) segs[k].classList.toggle("on", on.includes(k));
        // A "1" only uses the right-hand segments; centre it so "11" doesn't look gappy
        for (const k in segs) segs[k].setAttribute("transform", ch === "1" ? "translate(-23 0)" : "");
      }
    };
  }

  // pattern like "000" or "00:00:00" — ":" becomes a colon, everything else a digit
  function makeDisplay(container){
    return { set(str){ if (container.textContent !== str) container.textContent = str; } };
  }

  const disp = {
    days: makeDisplay(document.getElementById("daysDisplay"), "000"),
    mo: makeDisplay(document.getElementById("dMo"), "00"),
    wk: makeDisplay(document.getElementById("dWk"), "00"),
    dy: makeDisplay(document.getElementById("dDy"), "00"),
    hr: makeDisplay(document.getElementById("dHr"), "00"),
    mi: makeDisplay(document.getElementById("dMi"), "00"),
    se: makeDisplay(document.getElementById("dSe"), "00"),
    clock: makeDisplay(document.getElementById("localClock"), "00:00:00"),
  };

  /* ---------------- Timeline grid ---------------- */
  document.getElementById("targetDate").textContent =
    `${targetDate.getDate()} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][targetDate.getMonth()]} ${targetDate.getFullYear()}`;

  const startKey = dateKey(startDate);
  const endKey = dateKey(new Date(targetDate - 1)); // last full day before the target moment

  const grid = document.getElementById("grid");
  const dots = [];
  let y = startDate.getFullYear(), mo = startDate.getMonth(), firstRow = true;

  while (key(y, mo, 1) <= endKey){
    const label = document.createElement("div");
    label.className = "month";
    label.innerHTML = (firstRow || mo === 0) ? `${months[mo]} <span>${String(y).slice(2)}</span>` : months[mo];
    grid.appendChild(label);

    const daysInMonth = new Date(y, mo + 1, 0).getDate();
    for (let d = 1; d <= 31; d++){
      const cell = document.createElement("div");
      cell.className = "cell";
      if (d <= daysInMonth){
        const k = key(y, mo, d);
        const sq = document.createElement("div");
        const inRange = k >= startKey && k <= endKey;
        sq.className = "sq " + (inRange ? "todo" : "out");
        sq.title = `${d} ${months[mo]} ${y}`;
        cell.appendChild(sq);
        if (inRange) dots.push({ key: k, el: sq });
      }
      grid.appendChild(cell);
    }
    firstRow = false;
    mo++;
    if (mo > 11){ mo = 0; y++; }
  }

  const totalDays = dots.length;
  let lastKey = null;

  function paintGrid(todayKey, launched){
    const stamp = launched ? "launched" : todayKey;
    if (stamp === lastKey) return;                  // only repaint when the date changes
    lastKey = stamp;
    let done = 0;
    dots.forEach(({ key: k, el }) => {
      const isDone = launched || k < todayKey;
      const isToday = !launched && k === todayKey;
      if (isDone) done++;
      el.className = "sq " + (isDone ? "done" : isToday ? "today" : "todo");
    });
    grid.setAttribute("aria-label", `${done} of ${totalDays} days elapsed`);
  }

  /* ---------------- Months / weeks / days / … breakdown ---------------- */
  function addMonths(date, n){
    const d = new Date(date);
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, dim));                  // clamp 31 Jan + 1 month to 28/29 Feb
    return d;
  }

  function breakdown(from, to){
    let m = 0;
    while (addMonths(from, m + 1) <= to) m++;
    let rest = to - addMonths(from, m);
    const w = Math.floor(rest / WEEK); rest -= w * WEEK;
    const d = Math.floor(rest / DAY);  rest -= d * DAY;
    const h = Math.floor(rest / HOUR); rest -= h * HOUR;
    const mi = Math.floor(rest / MIN); rest -= mi * MIN;
    const s = Math.floor(rest / SEC);
    return { m, w, d, h, mi, s };
  }

  /* ---------------- Sound ---------------- */
  // All sounds are generated with the Web Audio API — no files needed.
  let actx = null, master = null, verb = null;

  function ensureAudio(){
    if (!actx){
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain();
      master.gain.value = 0.55;
      const limiter = actx.createDynamicsCompressor();   // keeps big hits from distorting
      limiter.threshold.value = -9;
      limiter.knee.value = 4;
      limiter.ratio.value = 20;
      limiter.attack.value = 0.001;
      limiter.release.value = 0.25;
      master.connect(limiter).connect(actx.destination);
    }
    if (actx.state === "suspended") actx.resume();
  }

  // Long, dark reverb: 4.5 s noise tail, high end rolled off
  function getVerb(){
    if (verb) return verb;
    const len = Math.floor(actx.sampleRate * 4.5);
    const buf = actx.createBuffer(2, len, actx.sampleRate);
    for (let c = 0; c < 2; c++){
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
    }
    verb = actx.createConvolver();
    verb.buffer = buf;
    const tone = actx.createBiquadFilter();
    tone.type = "lowpass";
    tone.frequency.value = 2200;
    const wet = actx.createGain();
    wet.gain.value = 0.75;
    verb.connect(tone).connect(wet).connect(master);
    return verb;
  }

  function env(g, t, gain, dur, attack = 0.003){
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }

  // Sends a voice to both the dry mix and the reverb
  function out(node, dry = 1){
    const d = actx.createGain();
    d.gain.value = dry;
    node.connect(d).connect(master);
    node.connect(getVerb());
  }

  // Simple sustained tone (used for drones and chords)
  function tone(freq, start, dur, { type = "sine", gain = 0.2, attack = 0.005 } = {}){
    const t = actx.currentTime + start;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    env(g, t, gain, dur, attack);
    o.connect(g);
    out(g);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  // Short filtered-noise transient
  function click(start, gain = 0.1, dur = 0.03, hp = 1200){
    const t = actx.currentTime + start;
    const len = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource();
    src.buffer = buf;
    const f = actx.createBiquadFilter();
    f.type = "highpass";
    f.frequency.value = hp;
    const g = actx.createGain();
    env(g, t, gain, dur, 0.001);
    src.connect(f).connect(g);
    out(g, 0.7);
    src.start(t);
  }

  // Deep thud: falling sine + sub layer + transient
  function thud(start, gain = 0.6, dur = 0.9, from = 110, to = 30){
    const t = actx.currentTime + start;
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(from, t);
    o.frequency.exponentialRampToValueAtTime(to, t + dur * 0.55);
    env(g, t, gain, dur, 0.02);                          // soft start: no click
    o.connect(g);
    out(g);
    const sub = actx.createOscillator(), sg = actx.createGain();
    sub.frequency.setValueAtTime(to * 1.2, t);
    env(sg, t, gain * 0.5, dur * 1.3, 0.02);
    sub.connect(sg).connect(master);
    o.start(t); sub.start(t);
    o.stop(t + dur + 0.05); sub.stop(t + dur * 1.3 + 0.05);
  }

  // Sonar: low sine that drifts down, with a quiet overtone; mostly reverb
  function sonar(freq, start, gain = 0.25, dur = 2.2, fade = 0){
    const t = actx.currentTime + start;
    gain *= 2.6;                                   // sine pings need more level to match the others
    [[1, gain], [2.01, gain * 0.35], [3.02, gain * 0.12]].forEach(([mult, gn]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.setValueAtTime(freq * mult, t);
      o.frequency.exponentialRampToValueAtTime(freq * mult * 0.96, t + dur);
      if (fade){
        // Smooth fade in, short hold, smooth fade out (no sharp edge at either end)
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(gn, t + fade);
        g.gain.setTargetAtTime(0, t + fade, (dur - fade) / 4);
      } else {
        env(g, t, gn, dur, 0.01);
      }
      o.connect(g);
      out(g, 0.6);
      o.start(t);
      o.stop(t + dur + 0.05);
    });
  }

  // Deep metallic clang: low FM tone, darkened, with a sub-octave underneath
  function clang(freq, start, dur = 2, gain = 0.2){
    const t = actx.currentTime + start;
    const car = actx.createOscillator(), mod = actx.createOscillator();
    const modG = actx.createGain(), g = actx.createGain(), lp = actx.createBiquadFilter();
    car.type = "square";
    car.frequency.value = freq;
    mod.frequency.value = freq * 1.41;
    modG.gain.setValueAtTime(freq * 2.2, t);
    modG.gain.exponentialRampToValueAtTime(freq * 0.2, t + dur);
    mod.connect(modG).connect(car.frequency);
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(1400, t);
    lp.frequency.exponentialRampToValueAtTime(300, t + dur);
    lp.Q.value = 2;
    env(g, t, gain, dur, 0.012);                          // smooth start: no click
    car.connect(lp).connect(g);
    out(g, 0.85);
    const sub = actx.createOscillator(), sg = actx.createGain();
    sub.frequency.value = freq / 2;
    env(sg, t, gain * 1.4, dur * 0.9, 0.01);
    sub.connect(sg).connect(master);
    car.start(t); mod.start(t); sub.start(t);
    car.stop(t + dur + 0.05); mod.stop(t + dur + 0.05); sub.stop(t + dur + 0.05);
  }

  // Low drone whose volume throbs, building up over its length
  function pulseDrone(freq, start, dur, gain = 0.3, rate = 3){
    const t = actx.currentTime + start;
    const o = actx.createOscillator(), g = actx.createGain();
    const lfo = actx.createOscillator(), lfoG = actx.createGain(), amp = actx.createGain();
    o.type = "triangle";
    o.frequency.value = freq;
    lfo.frequency.setValueAtTime(rate, t);
    lfo.frequency.linearRampToValueAtTime(rate * 2.5, t + dur);   // throbs speed up
    lfoG.gain.value = 0.5;
    amp.gain.value = 0.5;
    lfo.connect(lfoG).connect(amp.gain);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + dur * 0.9);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.05);
    o.connect(amp).connect(g);
    out(g, 0.9);
    o.start(t); lfo.start(t);
    o.stop(t + dur + 0.1); lfo.stop(t + dur + 0.1);
  }

  // Brass-like chord: detuned sawtooths, filter opens slowly, spread across stereo
  function brass(freqs, start, dur, gain = 0.06, attack = 0.5){
    const t = actx.currentTime + start;
    freqs.forEach((f, i) => {
      const pan = actx.createStereoPanner ? actx.createStereoPanner() : null;
      const g = actx.createGain(), lp = actx.createBiquadFilter();
      lp.type = "lowpass";
      lp.Q.value = 0.7;
      lp.frequency.setValueAtTime(200, t);
      lp.frequency.exponentialRampToValueAtTime(1800, t + attack * 1.4);
      lp.frequency.exponentialRampToValueAtTime(500, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + attack);
      g.gain.setValueAtTime(gain, t + dur * 0.6);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      [-7, 7].forEach(cents => {
        const o = actx.createOscillator();
        o.type = "sawtooth";
        o.frequency.value = f;
        o.detune.value = cents;
        o.connect(lp);
        o.start(t);
        o.stop(t + dur + 0.05);
      });
      lp.connect(g);
      if (pan){
        pan.pan.value = freqs.length > 1 ? -0.6 + (1.2 * i) / (freqs.length - 1) : 0;
        g.connect(pan);
        out(pan, 0.9);
      } else out(g, 0.9);
    });
  }

  // Noise riser: band-passed noise sweeping upward and getting louder
  function riser(start, dur, gain = 0.25){
    // Smooth swell: low tones gliding up an octave, plus a soft, rounded air layer (no crackle, no hard stop)
    const t = actx.currentTime + start;
    const fadeOut = Math.min(0.25, dur * 0.2);
    const g = actx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain * 0.5, t + dur - fadeOut);
    g.gain.linearRampToValueAtTime(0, t + dur);
    [[55, -6], [82.4, 5], [110, 0]].forEach(([f, c]) => {
      const o = actx.createOscillator();
      o.type = "triangle";
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(f * 2, t + dur);
      o.detune.value = c;
      o.connect(g);
      o.start(t); o.stop(t + dur + 0.05);
    });
    // air: noise kept below 1.6 kHz and smoothed by two filters
    const len = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource(); src.buffer = buf;
    const lp1 = actx.createBiquadFilter(), lp2 = actx.createBiquadFilter(), ag = actx.createGain();
    lp1.type = lp2.type = "lowpass";
    lp1.frequency.setValueAtTime(200, t); lp1.frequency.exponentialRampToValueAtTime(1600, t + dur);
    lp2.frequency.setValueAtTime(200, t); lp2.frequency.exponentialRampToValueAtTime(1600, t + dur);
    ag.gain.setValueAtTime(0, t);
    ag.gain.linearRampToValueAtTime(gain * 0.6, t + dur - fadeOut);
    ag.gain.linearRampToValueAtTime(0, t + dur);
    src.connect(lp1).connect(lp2).connect(ag);
    out(g, 0.8);
    out(ag, 0.8);
    src.start(t); src.stop(t + dur + 0.05);
  }

  // Timpani-style hit: pitched drum with a short skin noise
  function timp(freq, start, gain = 0.6, dur = 1.6){
    thud(start, gain, dur, freq * 1.15, freq);
  }

  // Timpani roll: fast soft hits that crescendo
  function roll(freq, start, dur, gain = 0.5){
    const n = Math.floor(dur / 0.06);
    for (let i = 0; i < n; i++) timp(freq, start + i * 0.06, gain * (0.25 + 0.75 * i / n), 0.25);
  }

  // Choir-like pad: detuned sawtooths through "ah" vowel formants
  function choir(freqs, start, dur, gain = 0.05, attack = 0.8){
    const t = actx.currentTime + start;
    freqs.forEach((f, i) => {
      const g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + attack);
      g.gain.setValueAtTime(gain, t + dur * 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      [[700, 5, 1], [1150, 6, 0.6], [2600, 8, 0.25]].forEach(([fq, q, lvl]) => {
        const bp = actx.createBiquadFilter(), bg = actx.createGain();
        bp.type = "bandpass";
        bp.frequency.value = fq;
        bp.Q.value = q;
        bg.gain.value = lvl * 3;
        [-9, 0, 9].forEach(c => {
          const o = actx.createOscillator();
          o.type = "sawtooth";
          o.frequency.value = f;
          o.detune.value = c;
          o.connect(bp);
          o.start(t);
          o.stop(t + dur + 0.05);
        });
        bp.connect(bg).connect(g);
      });
      const pan = actx.createStereoPanner ? actx.createStereoPanner() : null;
      if (pan){
        pan.pan.value = freqs.length > 1 ? -0.7 + (1.4 * i) / (freqs.length - 1) : 0;
        g.connect(pan);
        out(pan, 0.7);
      } else out(g, 0.7);
    });
  }

  // Soft high shimmer to crown the final chord
  function shimmer(freqs, start, dur, gain = 0.03){
    freqs.forEach((f, i) => tone(f, start + i * 0.12, dur, { gain, attack: 1.2 }));
  }

  // The built-in sounds: each bigger unit adds a layer
  const SOUNDS = {
    second(){ sonar(196, 0, 0.003, 0.8, 0.15); },            // the soft blip (G3), fades in and out
    minute(){ sonar(146.83, 0, 0.3, 2.8); },                 // single deep ping (D3)
    hour(){                                                  // two pings falling: D3… then a deep G2
      sonar(146.83, 0, 0.34, 2.6);
      sonar(98, 0.9, 0.42, 4.2);
    },
    day(){                                                   // three falling pings over a low hum; the last lands with a soft clang and a deep drum
      tone(49, 0, 5.5, { type: "triangle", gain: 0.16, attack: 0.8 });
      sonar(220, 0, 0.3, 2.4);
      sonar(146.83, 0.75, 0.36, 2.8);
      sonar(98, 1.5, 0.46, 4.6);
      clang(98, 1.5, 3.2, 0.16);
      thud(1.5, 0.75, 2.4, 70, 22);
      timp(36.7, 2.6, 0.6, 2.4);
    },
    week(){                                                  // riser → hit with a big low chord → two drum hits
      riser(0, 1.6, 0.22);
      tone(41.2, 0, 1.6, { type: "triangle", gain: 0.22, attack: 1.2 });
      clang(82.41, 1.6, 3.2, 0.26);
      thud(1.6, 1.0, 2.8, 70, 18);
      brass([82.41, 123.47, 164.81, 196], 1.6, 4.2, 0.05, 0.35);   // E minor
      timp(61.74, 3.3, 0.7);
      timp(41.2, 3.65, 0.9, 2.4);
    },
    month(){                                                 // ADDS CHOIR: throbbing build → massive hit → minor to major
      pulseDrone(36.7, 0, 3.0, 0.3, 3);
      riser(0.4, 2.6, 0.3);
      roll(55, 1.8, 1.2, 0.55);
      const H = 3.0;
      clang(55, H, 4.5, 0.32);
      clang(110, H, 3.0, 0.18);
      thud(H, 1.0, 3.8, 85, 15);
      brass([73.42, 110, 146.83, 174.61, 220], H, 2.4, 0.05, 0.2);          // D minor
      choir([146.83, 174.61, 220], H, 2.4, 0.045, 0.4);
      timp(58.27, H + 2.0, 0.9);
      brass([58.27, 116.54, 146.83, 174.61, 233.08, 293.66], H + 2.0, 4.8, 0.05, 0.3); // B♭ major
      choir([174.61, 233.08, 293.66], H + 2.0, 4.8, 0.05, 0.6);
      timp(36.7, H + 3.4, 1.0, 3.2);
    },
    launch(){                                                // EVERYTHING: long build → mega hit → 5-chord march → triple boom crown
      // 1. Build (≈5.5 s): 12 clangs that speed up AND rise in pitch, over a throbbing drone and a long whoosh
      let t = 0, gap = 0.85;
      pulseDrone(27.5, 0, 5.4, 0.3, 2);
      for (let i = 0; i < 12; i++){
        const f = 55 * Math.pow(2, i / 12);               // climbs a full octave
        clang(f, t, 0.5, 0.15 + i * 0.01);
        thud(t, 0.35 + i * 0.03, 0.45, 70, 32);
        t += gap; gap *= 0.84;
      }
      riser(0.2, t - 0.1, 0.35);
      riser(t - 1.6, 1.5, 0.3);
      roll(55, t - 1.6, 1.6, 0.6);

      // 2. Mega hit on A major
      const H = t + 0.1, step = 1.6;
      clang(41.2, H, 3.0, 0.3);
      clang(82.41, H, 3.0, 0.22);
      clang(164.81, H, 2.0, 0.1);
      thud(H, 1.0, 3.0, 100, 14);
      thud(H + 0.02, 0.8, 2.0, 60, 20);
      brass([55, 110, 138.59, 164.81, 220, 277.18], H, step + 0.2, 0.05, 0.12);
      choir([220, 277.18, 329.63], H, step + 0.3, 0.045, 0.3);

      // 3. March: F → G → E (each with a drum), roll into the final chord
      const march = [
        [[43.65, 87.31, 130.81, 174.61, 220], [174.61, 220, 261.63], 43.65],   // F major
        [[49, 98, 146.83, 196, 246.94],       [196, 246.94, 293.66], 49],      // G major
        [[41.2, 82.41, 123.47, 164.81, 207.65, 246.94], [207.65, 246.94, 329.63], 41.2] // E major
      ];
      march.forEach(([br, ch, drum], i) => {
        const at = H + step * (i + 1);
        timp(drum, at, 0.9);
        brass(br, at, step + 0.2, 0.05, 0.18);
        choir(ch, at, step + 0.3, 0.05, 0.3);
      });
      roll(55, H + step * 4 - 1.0, 1.0, 0.7);
      riser(H + step * 4 - 1.2, 1.15, 0.32);

      // 4. Crown (≈8 s): boom… boom… BOOM on a huge A major with choir and shimmer
      const F = H + step * 4;
      [0, 0.55, 1.1].forEach((d, i) => {
        clang(55, F + d, i === 2 ? 7 : 1.5, 0.26 + i * 0.03);
        clang(110, F + d, i === 2 ? 5 : 1.2, 0.14);
        thud(F + d, 0.85 + i * 0.075, i === 2 ? 5.5 : 1.2, 100, 14);
      });
      brass([55, 110, 164.81, 220, 277.18, 329.63, 440, 554.37], F, 8.0, 0.05, 0.4);
      choir([220, 277.18, 329.63, 440, 554.37], F, 8.0, 0.05, 0.6);
      shimmer([880, 1108.73, 1318.51, 1760], F + 1.1, 7.0, 0.03);
      tone(27.5, F + 1.1, 7.0, { type: "triangle", gain: 0.3, attack: 0.5 });   // sub swell under it all
      timp(41.2, F + 3.0, 0.95, 3.6);
      timp(55, F + 4.2, 0.85, 3.6);
    }
  };

  /* ---------- Final minute: sounds that intensify toward zero ---------- */
  // A low pulse that throbs faster and grows louder for the whole final minute
  function startFinalDrone(secsLeft){
    pulseDrone(36.7, 0, secsLeft, 0.3, 1.2);
    if (secsLeft > 30) pulseDrone(55, secsLeft - 30, 30, 0.2, 2);
    else pulseDrone(55, 0, secsLeft, 0.2, 2);
  }
  // One beat per second; it grows in four stages
  function finalTick(sec){
    if (actx && master){                             // whole mix rises from calm to loud across the minute
      master.gain.cancelScheduledValues(actx.currentTime);
      master.gain.setTargetAtTime(0.55 + 0.5 * (60 - sec) / 59, actx.currentTime, 0.1);
    }
    if (sec > 30){                                   // 60–31: a single ping, slowly louder
      sonar(146.83, 0, 0.12 + (60 - sec) * 0.005, 1.3);
    } else if (sec > 10){                            // 30–11: ping + a deep drum
      sonar(146.83, 0, 0.27, 1.3);
      thud(0, 0.3 + (30 - sec) * 0.018, 0.55, 70, 34);
    } else if (sec > 3){                             // 10–4: lower ping, metal hit, double heartbeat
      sonar(110, 0, 0.34, 1.4);
      clang(98, 0, 1.2, 0.14 + (10 - sec) * 0.012);
      thud(0, 0.7, 0.7, 75, 30);
      thud(0.45, 0.4, 0.4, 70, 40);
    } else {                                         // 3, 2, 1: the heaviest hits, with a swell into zero
      sonar(98, 0, 0.42, 1.6);
      clang(73.42, 0, 1.6, 0.24);
      thud(0, 0.95, 1.0, 80, 24);
      timp(36.7, 0, 0.8, 1.5);
      if (sec === 3) riser(0, 3, 0.4);
    }
  }

  // Volume ladder: each bigger unit plays louder, then the mix settles back
  const LEVEL = { second: 0.55, minute: 0.55, hour: 0.45, day: 0.48, week: 0.9, month: 1.05, launch: 1.45 };
  const LENGTH = { hour: 5.5, day: 6.5, week: 7, month: 10.5, launch: 21 };
  let boostUntil = 0;

  function play(unit){
    if (actx && master && LENGTH[unit]){
      const now = actx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setTargetAtTime(LEVEL[unit], now, 0.01);
      master.gain.setTargetAtTime(LEVEL.second, now + LENGTH[unit], 0.5);
      boostUntil = now + LENGTH[unit];
    }
    SOUNDS[unit]();
  }

  // Sound mode: "all" → "quiet" (no seconds tick) → "off" → back to "all"
  const soundBtn = document.getElementById("soundBtn");
  const NEXT = { all: "quiet", quiet: "off", off: "all" };
  const LABEL = {
    all:   "Sound on. Click to mute the seconds tick",
    quiet: "Seconds tick muted. Click to mute all sound",
    off:   "All sound muted. Click to turn sound back on"
  };
  let mode = "all";
  try { const m = localStorage.getItem("walidCounterMode"); if (LABEL[m]) mode = m; } catch (e) {}

  function applyMode(){
    soundBtn.dataset.mode = mode;
    soundBtn.setAttribute("aria-label", LABEL[mode]);
    soundBtn.title = LABEL[mode];
    try { localStorage.setItem("walidCounterMode", mode); } catch (e) {}
  }
  applyMode();

  soundBtn.addEventListener("click", () => {
    ensureAudio();
    mode = NEXT[mode];
    applyMode();
  });

  // Browsers only allow sound after the first interaction, so unlock audio on the first click, tap or key
  // (On iPhone only a finished tap counts, so touchend and click are included.)
  const UNLOCK = ["pointerdown", "pointerup", "touchend", "click", "keydown"];
  function unlock(){
    ensureAudio();
    UNLOCK.forEach(ev => window.removeEventListener(ev, unlock, true));
    if (pendingLaunch) playLaunchNow();               // page opened after the date: play the launch now
  }
  UNLOCK.forEach(ev => window.addEventListener(ev, unlock, true));
  let pendingLaunch = false;

  const shouldPlay = (unit) => mode === "all" || (mode === "quiet" && unit !== "second");

  const unitEls = {
    month: document.getElementById("uMo"),
    week: document.getElementById("uWk"),
    day: document.getElementById("uDy"),
    hour: document.getElementById("uHr"),
    minute: document.getElementById("uMi"),
  };

  function flash(unit){
    const el = unitEls[unit];
    if (!el) return;
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
  }

  let prev = null, wasLaunched = null;

  // Play only the biggest unit that just completed
  function announce(b, totalDaysLeft, launched){
    if (inFinal || launched){ prev = { ...b, days: totalDaysLeft }; wasLaunched = launched; return; }   // the final sequence has its own sounds
    if (prev && document.visibilityState === "visible"){
      let unit = null;
      if (launched && wasLaunched === false) unit = "launch";
      else if (b.m !== prev.m) unit = "month";
      else if (b.w !== prev.w) unit = "week";
      else if (totalDaysLeft !== prev.days || b.d !== prev.d) unit = "day";
      else if (b.h !== prev.h) unit = "hour";
      else if (b.mi !== prev.mi) unit = "minute";
      else if (b.s !== prev.s) unit = "second";

      if (unit){
        flash(unit);
        if (actx && shouldPlay(unit)) play(unit);
      }
    }
    prev = { ...b, days: totalDaysLeft };
    wasLaunched = launched;
  }

  /* ---------------- Hidden test: 5 quick clicks plays a unit's sound ---------------- */
  const TAP_TARGETS = [
    ["uSe", "second"], ["uMi", "minute"], ["uHr", "hour"],
    ["uDy", "day"], ["uWk", "week"], ["uMo", "month"],
    ["daysDisplay", "launch"]                       // the big days number previews the launch finale
  ];

  TAP_TARGETS.forEach(([id, unit]) => {
    const el = document.getElementById(id);
    let taps = [];
    el.style.userSelect = "none";                   // stop rapid clicks from selecting text
    el.addEventListener("click", () => {
      const now = performance.now();
      taps = taps.filter(t => now - t < 2000);      // 5 clicks within 2 seconds
      taps.push(now);
      if (taps.length >= 5){
        taps = [];
        ensureAudio();
        play(unit);                                 // plays even when muted: it's a deliberate test
        el.classList.remove("flash");
        void el.offsetWidth;
        el.classList.add("flash");
      }
    });
  });

  /* ---------------- Clock (real time, or simulated during a preview) ---------------- */
  let simOffset = 0, previewing = false;
  const nowTime = () => new Date(Date.now() + simOffset);

  /* ---------------- Final minute + zero ---------------- */
  const overlay = document.getElementById("finalOverlay");
  const finalLabel = document.getElementById("finalLabel");
  const finalBar = document.getElementById("finalBar");
  const finalDigitsEl = document.getElementById("finalDigits");
  const finalDigits = makeDisplay(finalDigitsEl, "00");

  let inFinal = false;          // overlay currently running
  let droneOn = false;          // final-minute pulse scheduled
  let lastSec = null;           // last whole second shown in the overlay
  let zeroAt = null;            // time the overlay hit zero
  let launchDone = false;       // launch already played for this run
  let previewEndTimer = null;

  const finalAudible = () => previewing || mode !== "off";

  function playLaunchNow(){
    pendingLaunch = false;
    if (!actx || !finalAudible()) return;
    launchDone = true;
    play("launch");
  }

  function showOverlay(){
    inFinal = true;
    overlay.classList.add("show");
    overlay.setAttribute("aria-hidden", "false");
  }
  function hideOverlay(){
    inFinal = false;
    overlay.classList.remove("show");
    overlay.setAttribute("aria-hidden", "true");
  }

  function runFinal(now, diff){
    // Last 60 seconds: overlay with a whole-second countdown (60 … 1)
    if (diff > 0 && diff <= 60000){
      if (!inFinal){ overlay.dataset.phase = "calm"; showOverlay(); lastSec = null; droneOn = false; zeroAt = null; launchDone = false; }
      const sec = Math.ceil(diff / 1000);
      overlay.dataset.phase = sec > 30 ? "calm" : sec > 10 ? "tense" : "critical";
      finalLabel.textContent = sec > 10 ? "Final minute" : "Final seconds";
      finalBar.style.width = (diff / 600) + "%";
      if (sec !== lastSec){
        finalDigits.set(pad(sec));
        finalDigitsEl.classList.remove("beat"); void finalDigitsEl.offsetWidth; finalDigitsEl.classList.add("beat");
        if (actx && finalAudible()){
          if (!droneOn){ startFinalDrone(diff / 1000); droneOn = true; }
          finalTick(sec);
        }
        lastSec = sec;
      }
      return;
    }
    // Zero: launch sound, "Target reached", then the overlay fades after 10 s
    if (diff <= 0 && inFinal){
      if (zeroAt === null){
        zeroAt = now.getTime();
        overlay.dataset.phase = "zero";
        finalLabel.textContent = "";
        if (actx && finalAudible() && !launchDone){
          if (document.visibilityState === "visible") playLaunchNow(); else pendingLaunch = true;
        } else if (!actx) pendingLaunch = true;
      }
      if (now.getTime() - zeroAt >= 10000){
        hideOverlay();
        if (previewing && !previewEndTimer) previewEndTimer = setTimeout(exitPreview, 9000);   // preview: show the final screen, then return
      }
    }
  }

  /* ---------------- Preview ---------------- */
  function resetAudio(){
    // Stop everything that is playing by starting a fresh audio engine
    if (actx){ try { actx.close(); } catch (e) {} }
    actx = null; master = null; verb = null;
    ensureAudio();
  }
  function startPreview(secs = 60.4){
    if (!previewing && targetDate - Date.now() <= 60000) return;      // the real thing is happening
    previewing = true;
    document.body.classList.add("previewing");
    clearTimeout(previewEndTimer); previewEndTimer = null;
    hideOverlay();
    resetAudio();
    simOffset = targetDate.getTime() - Date.now() - secs * 1000;
    prev = null;
    update();
  }
  function exitPreview(){
    clearTimeout(previewEndTimer); previewEndTimer = null;
    previewing = false;
    simOffset = 0;
    document.body.classList.remove("previewing");
    hideOverlay();
    resetAudio();
    prev = null; lastKey = null;
    update();
  }
  document.getElementById("skipBtn").addEventListener("click", () => { startPreview(10.4); });
  document.getElementById("exitBtn").addEventListener("click", exitPreview);
  document.getElementById("exitBtn2").addEventListener("click", exitPreview);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && previewing) exitPreview(); });

  // Came back to the tab after zero passed in the background: play the launch then
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && pendingLaunch && actx) playLaunchNow();
  });

  /* ---------------- Tick ---------------- */
  const daysLabel = document.getElementById("daysLabel");
  const dayCount = document.getElementById("dayCount");
  const progress = document.getElementById("progress");
  const statusFlag = document.getElementById("statusFlag");
  const ZERO = { m: 0, w: 0, d: 0, h: 0, mi: 0, s: 0 };
  let firstRun = true;

  function update(){
    const now = nowTime();
    const diff = targetDate - now;
    const launched = diff <= 0;
    let b, daysLeft;

    if (launched){
      // At and after the target: everything reads zero and "Today is the day" shows (once the overlay has gone)
      document.body.classList.add("launched");
      document.body.classList.toggle("arrived", !inFinal);
      statusFlag.textContent = "Today is the day";
      progress.textContent = "100%";
      dayCount.textContent = `Day ${totalDays} / ${totalDays}`;
      paintGrid(null, true);
      b = ZERO; daysLeft = 0;
      if (firstRun && !previewing){ pendingLaunch = true; if (actx) playLaunchNow(); }   // opened after the date
    } else {
      document.body.classList.remove("launched", "arrived");
      statusFlag.textContent = previewing ? "Preview" : "Countdown active";
      const todayKey = dateKey(now);
      paintGrid(todayKey, false);
      const dayNum = Math.max(dots.findIndex(x => x.key === todayKey) + 1, 0);
      dayCount.textContent = `Day ${pad(dayNum, 3)} / ${totalDays}`;
      const pct = Math.max(0, Math.min(100, (now - startDate) / (targetDate - startDate) * 100));
      progress.textContent = pct.toFixed(1) + "%";
      b = breakdown(now, targetDate);
      // Count calendar days on the wall clock, so summer/winter time changes can't shift it by an hour
      const wall = (d) => Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds(), d.getMilliseconds());
      daysLeft = Math.floor((wall(targetDate) - wall(now)) / DAY);
    }

    disp.days.set(pad(daysLeft, 3));
    disp.mo.set(pad(b.m));
    disp.wk.set(pad(b.w));
    disp.dy.set(pad(b.d));
    disp.hr.set(pad(b.h));
    disp.mi.set(pad(b.mi));
    disp.se.set(pad(b.s));
    disp.clock.set(`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`);

    runFinal(now, diff);
    if (launched) document.body.classList.toggle("arrived", !inFinal);
    announce(b, daysLeft, launched);
    firstRun = false;
  }

  update();
  setInterval(update, 200);                           // 5× a second so the final countdown lands exactly on each second
</script>

</body>
</html>
